name: phpx-tests
on: [ push, pull_request ]

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.4, 8.5 ]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout phpy
        uses: actions/checkout@v4
        with:
          repository: swoole/phpy
          path: third_party/phpy
      - name: Setup PHP and dependencies from PPA
        shell: bash
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update
          sudo apt-get install --yes software-properties-common
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --yes \
            googletest \
            lcov \
            libargon2-dev \
            libgmp-dev \
            libgtest-dev \
            libkrb5-dev \
            libmpfr-dev \
            libsodium-dev \
            python3-dev \
            redis-server \
            "php${PHP_VERSION}-cli" \
            "php${PHP_VERSION}-common" \
            "php${PHP_VERSION}-curl" \
            "php${PHP_VERSION}-dev" \
            "php${PHP_VERSION}-mbstring" \
            "php${PHP_VERSION}-opcache" \
            "php${PHP_VERSION}-readline" \
            "php${PHP_VERSION}-redis" \
            "php${PHP_VERSION}-xml" \
            "php${PHP_VERSION}-zip" \
            "libphp${PHP_VERSION}-embed"

          sudo update-alternatives --set php "/usr/bin/php${PHP_VERSION}"
          sudo update-alternatives --set phpize "/usr/bin/phpize${PHP_VERSION}"
          sudo update-alternatives --set php-config "/usr/bin/php-config${PHP_VERSION}"
          sudo phpenmod -v "${PHP_VERSION}" ffi opcache

          php_ini_dir="/etc/php/${PHP_VERSION}/cli/conf.d"
          printf '%s\n' \
            'ffi.enable=1' \
            'opcache.jit=0' \
            | sudo tee "${php_ini_dir}/99-phpx-ci.ini" >/dev/null

          embed_package="libphp${PHP_VERSION}-embed"
          php_version="$(php-config --version)"
          embed_version="$(dpkg-query --show --showformat='${Version}' "${embed_package}")"
          case "${embed_version}" in
            "${php_version}"*) ;;
            *)
              echo "${embed_package} ${embed_version} does not match PHP ${php_version}" >&2
              exit 1
              ;;
          esac

          embed_library="$(dpkg-query --listfiles "${embed_package}" \
            | sed -n '/\/libphp[0-9][^/]*\.so$/ { p; q; }')"
          test -n "${embed_library}"
          test -f "${embed_library}"

          embed_dir="${RUNNER_TEMP}/php-embed-${PHP_VERSION}"
          mkdir -p "${embed_dir}"
          ln -s "${embed_library}" "${embed_dir}/libphp.so"
          ln -s "${embed_library}" "${embed_dir}/$(basename "${embed_library}")"

          echo "PHP_INI_SCAN_DIR=${php_ini_dir}" >> "${GITHUB_ENV}"
          echo "PHP_EMBED_LIBRARY=${embed_library}" >> "${GITHUB_ENV}"
          echo "LIBRARY_PATH=${embed_dir}${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${embed_dir}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"

          test "$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "${PHP_VERSION}"
          php -r 'foreach (["curl", "ffi", "mbstring", "redis", "xml", "zip", "Zend OPcache"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: $extension\n"); exit(1); } }'
          composer --version
          echo "Using ${embed_library} from ${embed_package} ${embed_version}"
      # Temporary workaround for php/php-src#22935. Some PHP 8.4/8.5
      # packages contain a php_hash.h revision that is valid C but invalid C++.
      # Keep the source patch separate and remove this step once all supported
      # PHP patch releases contain php/php-src#22940.
      - name: Patch php_hash.h C++ compatibility
        shell: bash
        run: |
          php_include_dir="$(php-config --include-dir)"
          php_hash_header="${php_include_dir}/ext/hash/php_hash.h"

          if grep -Fq 'char *base = ecalloc(' "${php_hash_header}"; then
            sudo patch --directory="${php_include_dir}" --strip=1 \
              < .github/patches/php-hash-cxx.patch
          else
            echo "php_hash.h already contains the upstream C++ fix"
          fi
      - name: Detect Python ABI
        id: python-abi
        run: echo "version=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')" >> "${GITHUB_OUTPUT}"
      - name: Cache phpy extension
        id: cache-phpy
        uses: actions/cache@v4
        with:
          path: third_party/phpy/modules/phpy.so
          key: phpy-${{ runner.os }}-${{ runner.arch }}-php${{ matrix.php }}-python${{ steps.python-abi.outputs.version }}-${{ hashFiles('third_party/phpy/phpy.cc', 'third_party/phpy/config.m4', 'third_party/phpy/include/**', 'third_party/phpy/src/**') }}
      - name: Build phpy for native bridge tests
        if: steps.cache-phpy.outputs.cache-hit != 'true'
        working-directory: third_party/phpy
        run: |
          phpize
          ./configure
          make -j$(nproc)
      - name: Enable phpy for native bridge tests
        working-directory: third_party/phpy
        run: |
          php_ini_dir="/etc/php/${{ matrix.php }}/cli/conf.d"
          echo "extension=$(pwd)/modules/phpy.so" | sudo tee "${php_ini_dir}/90-phpy.ini"
          php --ri phpy
      - name: Show machine information
        run: |
          date
          env
          uname -a
          php -v
          php --ini
      - name: Build
        run: |
          cmake . -D CODE_COVERAGE=ON -D GITHUB_ACTION=ON -D ENABLE_FACADE_API=ON || exit 1
          make VERBOSE=1 -j$(nproc)
          linked_embed="$(ldd ./bin/phpx-tests \
            | awk '$1 ~ /^libphp[0-9.]*\.so/ { print $3; exit }')"
          test -n "${linked_embed}"
          test "$(readlink -f "${linked_embed}")" = "$(readlink -f "${PHP_EMBED_LIBRARY}")"
          ldd ./bin/phpx-tests | grep -E 'libphp(x)?[0-9.]*\.so'
      - name: Run google tests
        run: |
          # sudo sh -c 'echo 0 > /proc/sys/kernel/randomize_va_space'
          # php_embed_init() may use a SAPI-specific default scan directory
          # rather than the CLI directory configured above. PHP_INI_SCAN_DIR
          # keeps the embedded process on the verified CLI extension set.
          ./bin/phpx-tests
      - name: Run phpunit tests
        run: |
          composer install
          sudo cp lib/ext.so $(php-config --extension-dir)/phpx_test.so
          echo "extension=phpx_test.so" \
            | sudo tee "/etc/php/${{ matrix.php }}/cli/conf.d/90-phpx_test.ini"
          composer test
      - name: Run coverage
        shell: bash
        run: |
          sudo lcov --directory . --capture --branch-coverage --rc geninfo_unexecuted_blocks=1 --ignore-errors mismatch --output-file coverage.info
          sudo lcov --remove coverage.info '/usr/*' --output-file coverage.info
          sudo lcov --list coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          fail_ci_if_error: true
